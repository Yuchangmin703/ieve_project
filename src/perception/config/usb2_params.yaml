camera:
  frame_id: camera_link
  width: 640
  height: 480
  distortion_model: plumb_bob

intrinsics:
  fx: 508.0764
  fy: 678.3076
  cx: 329.8464
  cy: 269.4065
  k1: -0.409645
  k2: 0.145633
  p1: 0.0
  p2: 0.0
  k3: 0.0

extrinsics:
  # 사용자님의 요청에 따라 이 부분은 원래 값 그대로 유지합니다.
  pitch_deg: 31.1608
  yaw_deg: 0.0
  roll_deg: -0.8549
  height_m: 0.2735

bev:
  # ★★ 중요: 현재 카메라 각도에서 확실히 보일 만한, 더 먼 영역으로 수정 ★★
  x_min: 0.50      # 너무 가까운 10cm 대신, 50cm 앞부터 보도록 수정
  x_max: 1.50      # 최대 거리는 그대로 유지
  y_min: -0.50     # 좌우 폭을 약간 줄여서 화면 안에 들어올 확률을 높임
  y_max: 0.50
  output_width: 500
  output_height: 700
